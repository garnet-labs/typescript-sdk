name: Garnet TypeScript SDK CI

on:
  workflow_dispatch:

jobs:
  dep-install:
    name: SDK Install + Build (Garnet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-frozen-lockfile 2>/dev/null || npm install || true

      - name: List installed packages
        run: npm list --depth 1 2>/dev/null | head -40 || true
